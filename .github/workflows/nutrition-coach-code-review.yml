name: Nutrition Coach code review

on:
  pull_request:
    branches: [feat/nutrition-coach]
    paths:
      - "nutrition-coach/src/**"
      - "nutrition-coach/supabase/**"
      - "nutrition-coach/package*.json"
      - "nutrition-coach/*.config.*"
      - "nutrition-coach/tsconfig.json"
      - ".github/workflows/nutrition-coach-code-review.yml"

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/code-review:code-review --comment"
